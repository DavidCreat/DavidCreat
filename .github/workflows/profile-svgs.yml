name: Generate Profile SVGs (real data)

on:
  schedule:
    # Todos los dias a las 06:00 UTC (01:00 en Colombia)
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate-svgs.mjs"
      - ".github/workflows/profile-svgs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-svgs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate SVGs from GitHub API
        run: node scripts/generate-svgs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets README.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets README.md
            git commit -m "chore(profile): refresh generated SVGs with live GitHub data"
            git push
          else
            echo "Sin cambios."
          fi
