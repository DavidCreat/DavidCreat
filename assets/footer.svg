    <text x="0" y="140" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2" fill="#8A7A3A">V2026.11 <tspan fill="#FFD700">·</tspan> IBAGUÉ, CO <tspan fill="#FFD700">·</tspan> MIT</text>
